[data]
source_url = "https://archive.ics.uci.edu/static/public/222/bank+marketing.zip"
archive_sha256 = "e0bf5f5de5b846e2f18e9d90606637267d46dfa260e0f17bb12e605db5efbeb4"
csv_sha256 = "d1513ec63b385506f7cfce9f2c5caa9fe99e7ba4e8c3fa264b3aaf0f849ed32d"
# Chemins relatifs au fichier de configuration.
raw_dir = "../data/raw"
report_dir = "../data/reports"

[validation]
min_rows = 1

[training]
train_fraction = 0.70
validation_fraction = 0.15
regularization_c = 1.0
max_iter = 1000
random_state = 42
threshold = 0.5
output_dir = "../models"

[mlflow]
tracking_uri = "http://127.0.0.1:5000"
experiment_name = "bank-marketing"
model_name = "bank-marketing-logistic-regression"

[registry]
min_average_precision_gain = 0.0

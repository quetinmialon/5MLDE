name: bank-marketing

services:
  postgres:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD dans .env}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?Renseigner MLFLOW_DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-mlflow.sh:/docker-entrypoint-initdb.d/init-mlflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:17.12-bookworm
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD dans .env}
      PREFECT_DB_PASSWORD: ${PREFECT_DB_PASSWORD:?Renseigner PREFECT_DB_PASSWORD dans .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Renseigner APP_DB_PASSWORD dans .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Renseigner GRAFANA_DB_PASSWORD dans .env}
    entrypoint: ["/bin/sh", "/init-databases.sh"]
    volumes:
      - ./infra/postgres/init-databases.sh:/init-databases.sh:ro
      - ./infra/postgres/app-schema.sql:/app-schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    build: .
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?Renseigner MLFLOW_DB_PASSWORD dans .env}@postgres:5432/mlflow
      MLFLOW_ENABLE_TELEMETRY: "false"
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --workers
      - "1"
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  prefect:
    build: .
    restart: unless-stopped
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:?Renseigner PREFECT_DB_PASSWORD dans .env}@postgres:5432/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_DOCKET_URL: memory://
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  pipeline-runner:
    build: .
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ENABLE_TELEMETRY: "false"
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD:?Renseigner APP_DB_PASSWORD dans .env}@postgres:5432/bank_marketing
    command: ["python", "-m", "bank_marketing.flows", "serve"]
    volumes:
      - ./config:/app/config:ro
      - pipeline_data:/app/data
      - pipeline_models:/app/models
    depends_on:
      db-init:
        condition: service_completed_successfully
      prefect:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD:?Renseigner APP_DB_PASSWORD dans .env}@postgres:5432/bank_marketing
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ENABLE_TELEMETRY: "false"
    command: ["uvicorn", "bank_marketing.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    # Limites variables pour comparer des configurations en test de charge.
    cpus: ${API_CPUS:-1}
    mem_limit: ${API_MEMORY:-1g}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Renseigner GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Renseigner GRAFANA_DB_PASSWORD dans .env}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

  # Lancé à la demande : docker compose --profile load run --rm locust ...
  locust:
    image: locustio/locust:2.37.10
    profiles: ["load"]
    cpus: 2
    working_dir: /mnt/load
    volumes:
      - ./load_tests:/mnt/load
      - ./reports/load:/mnt/reports
    depends_on:
      - api

volumes:
  postgres_data:
  mlflow_artifacts:
  pipeline_data:
  pipeline_models:
  prometheus_data:
  grafana_data:

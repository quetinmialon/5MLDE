name: Vérifications Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    name: Installation — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Isole le projet des outils préinstallés sur le runner (ex. pipx).
      - name: Créer un environnement virtuel
        shell: bash
        run: |
          python -m venv .venv
          python -c "import os; print(os.path.join(os.getcwd(), '.venv', 'Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - name: Installer les outils figés
        run: python -m pip install --no-deps -r requirements.txt
      - name: Construire et installer le paquet
        run: python -m pip install --no-build-isolation --no-deps .
      - name: Vérifier les dépendances
        run: python -m pip check
      - name: Vérifier le paquet installé
        run: python -I -c "import bank_marketing; from importlib.metadata import version; print(version('bank-marketing')); print(bank_marketing.__file__)"
      - name: Tester les données et le modèle
        run: python -m pytest -q

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing"
version = "0.1.0"
description = "Chaîne MLOps pour le dataset UCI Bank Marketing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["bank_marketing*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
